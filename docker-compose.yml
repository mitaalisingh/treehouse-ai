services:
  postgres:
    image: postgres:16-alpine
    container_name: treehouse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: treehouse
      POSTGRES_USER: treehouse
      POSTGRES_PASSWORD: treehouse
    volumes:
      - treehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treehouse -d treehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  treehouse_postgres_data:
